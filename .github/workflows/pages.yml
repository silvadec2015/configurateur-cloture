# Publie le configurateur sur GitHub Pages à chaque push sur main.
#
# Le site est statique : aucune construction n'est nécessaire, on assemble
# simplement les fichiers servis dans `_site`. Les tests du moteur de calcul
# tournent avant la publication : une nomenclature fausse ne doit pas être
# mise en ligne.
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests du moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lancer les tests
        run: npm test

  publication:
    name: Publication
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` active GitHub Pages au premier passage : aucun
      # réglage manuel n'est nécessaire dans l'interface du dépôt.
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assembler le site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets src _site/
          # Évite que Jekyll ne réinterprète les fichiers publiés.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
